name: Build (reusable)

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup Rust (linux musl + windows-gnu + freebsd targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,x86_64-pc-windows-gnu,x86_64-unknown-freebsd

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cross
          # GHA scopes cache *writes* to the creating ref, so entries written by
          # a tag run are never readable again — they only evict main's under the
          # 10 GB repo cap. Tag runs still restore from the default branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross-toolchains
        run: |
          sudo apt-get update
          # apt-only C cross-compilers; Rust supplies the static musl libc itself.
          # clang/lld/llvm are for the FreeBSD cross-build (no apt freebsd gcc).
          # (linker/CC wiring lives in .cargo/config.toml)
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu \
                                  gcc-arm-linux-gnueabihf gcc-mingw-w64-x86-64 \
                                  clang lld llvm

      - name: Install npm dependencies
        run: npm ci

      - name: Build linux/windows binaries (compile once → raw + zips)
        run: make build-linux-ci

      - name: Build FreeBSD server + sb CLI
        run: |
          sudo mkdir -p /opt/freebsd-sysroot
          # Link against the OLDEST release still on the mirror, not the newest.
          # FreeBSD's libc uses symbol versioning (FBSD_1.x) that is only
          # backward compatible: a binary linked against 15.1 records a
          # FBSD_1.9 dependency and then refuses to start on 15.0 or 14.x
          # ("version FBSD_1.9 required by silverbullet not found"), while one
          # linked against 14.3 (max FBSD_1.8) runs on everything newer too.
          # The mirror only carries supported releases, so "oldest available"
          # tracks the support window on its own and never 404s on a pinned
          # version that got pruned.
          VER=$(curl -fsSL https://download.freebsd.org/releases/amd64/ \
            | grep -oE '[0-9]+\.[0-9]+-RELEASE' | sort -V | uniq | head -1)
          echo "Oldest supported FreeBSD release (sysroot): $VER"
          curl -fsSL "https://download.freebsd.org/releases/amd64/$VER/base.txz" \
            | sudo tar -xJf - -C /opt/freebsd-sysroot ./lib ./usr/lib ./usr/include
          make build-server-releases-freebsd
          make build-cli-releases-freebsd

      - name: Upload release zips (linux/windows/freebsd)
        uses: actions/upload-artifact@v7
        with:
          name: release-zips-linux
          path: |
            silverbullet-server-*.zip
            sb-*.zip
          if-no-files-found: error

      - name: Upload raw docker binaries
        uses: actions/upload-artifact@v7
        with:
          name: docker-binaries
          path: |
            silverbullet-amd64
            silverbullet-arm64
            silverbullet-arm
          if-no-files-found: error
